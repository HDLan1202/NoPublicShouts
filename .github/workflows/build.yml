name: Build NoPublicShouts v1.0.2

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - ".github/workflows/build.yml"
      - "CMakeLists.txt"
      - "vcpkg.json"
      - "vcpkg-configuration.json"
      - "ports/**"
      - "src/**"

jobs:
  build:
    runs-on: windows-2022

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Enable MSVC developer environment
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Install Ninja
        uses: seanmiddleditch/gha-setup-ninja@master

      - name: Bootstrap isolated vcpkg
        shell: pwsh
        run: |
          $root = Join-Path $env:RUNNER_TEMP "NoPublicShouts-vcpkg"
          if (Test-Path $root) {
            Remove-Item -Recurse -Force $root
          }
          git clone --depth 1 https://github.com/microsoft/vcpkg.git $root
          & "$root/bootstrap-vcpkg.bat" -disableMetrics
          "VCPKG_ROOT=$root" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Configure
        shell: pwsh
        run: |
          cmake -S . -B build -G Ninja `
            -DCMAKE_BUILD_TYPE=Release `
            "-DCMAKE_TOOLCHAIN_FILE=$env:VCPKG_ROOT/scripts/buildsystems/vcpkg.cmake" `
            -DVCPKG_TARGET_TRIPLET=x64-windows-static-md `
            "-DVCPKG_OVERLAY_PORTS=$env:GITHUB_WORKSPACE/ports"

      - name: Build
        shell: pwsh
        run: cmake --build build --config Release --parallel

      - name: Verify DLL
        shell: pwsh
        run: |
          $dll = Get-ChildItem -Path build -Filter NoPublicShouts.dll -Recurse | Select-Object -First 1
          if (-not $dll) {
            Get-ChildItem -Path build -Recurse | Select-Object FullName
            throw "NoPublicShouts.dll was not produced."
          }
          Write-Host "Built DLL: $($dll.FullName)"
          Write-Host "DLL size: $($dll.Length) bytes"

      - name: Create MO2 package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path package/SKSE/Plugins | Out-Null
          $dll = Get-ChildItem -Path build -Filter NoPublicShouts.dll -Recurse | Select-Object -First 1
          if (-not $dll) { throw "NoPublicShouts.dll was not produced." }
          Copy-Item $dll.FullName package/SKSE/Plugins/NoPublicShouts.dll
          Compress-Archive -Path package/* -DestinationPath NoPublicShouts_v1.0.2_FalseDragonborn_MO2.zip -Force

      - name: Upload MO2 ZIP
        uses: actions/upload-artifact@v4
        with:
          name: NoPublicShouts-v1.0.2-FalseDragonborn-MO2
          path: NoPublicShouts_v1.0.2_FalseDragonborn_MO2.zip
          if-no-files-found: error
