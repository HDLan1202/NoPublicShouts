name: Build ThorinDragonSoulVisuals v0.1.0

on:
  workflow_dispatch:
  push:
    branches: [ thorin-dragon-soul-visuals ]
    paths:
      - ".github/workflows/build.yml"
      - "CMakeLists.txt"
      - "vcpkg.json"
      - "vcpkg-configuration.json"
      - "ports/**"
      - "src/**"
      - "config/**"

jobs:
  build:
    runs-on: windows-2022

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: thorin-dragon-soul-visuals

      - name: Enable MSVC developer environment
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Install Ninja
        uses: seanmiddleditch/gha-setup-ninja@master

      - name: Bootstrap isolated vcpkg
        shell: pwsh
        run: |
          $root = Join-Path $env:RUNNER_TEMP "ThorinDragonSoulVisuals-vcpkg"
          if (Test-Path $root) { Remove-Item -Recurse -Force $root }
          git clone --depth 1 https://github.com/microsoft/vcpkg.git $root
          & "$root/bootstrap-vcpkg.bat" -disableMetrics
          "VCPKG_ROOT=$root" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Configure
        shell: pwsh
        run: |
          cmake -S . -B build -G Ninja `
            -DCMAKE_BUILD_TYPE=Release `
            "-DCMAKE_TOOLCHAIN_FILE=$env:VCPKG_ROOT/scripts/buildsystems/vcpkg.cmake" `
            -DVCPKG_TARGET_TRIPLET=x64-windows-static-md `
            "-DVCPKG_OVERLAY_PORTS=$env:GITHUB_WORKSPACE/ports"

      - name: Build
        shell: pwsh
        run: cmake --build build --config Release --parallel

      - name: Create MO2 package
        shell: pwsh
        run: |
          $dll = Get-ChildItem -Path build -Filter ThorinDragonSoulVisuals.dll -Recurse | Select-Object -First 1
          if (-not $dll) {
            Get-ChildItem -Path build -Recurse | Select-Object FullName
            throw "ThorinDragonSoulVisuals.dll was not produced."
          }
          New-Item -ItemType Directory -Force -Path package/SKSE/Plugins | Out-Null
          Copy-Item $dll.FullName package/SKSE/Plugins/ThorinDragonSoulVisuals.dll
          Copy-Item config/ThorinDragonSoulVisuals.ini package/SKSE/Plugins/ThorinDragonSoulVisuals.ini
          Compress-Archive -Path package/* -DestinationPath ThorinDragonSoulVisuals_v0.1.0_MO2.zip -Force
          Write-Host "Built DLL: $($dll.FullName) ($($dll.Length) bytes)"

      - name: Upload MO2 ZIP
        uses: actions/upload-artifact@v4
        with:
          name: ThorinDragonSoulVisuals-v0.1.0-MO2
          path: ThorinDragonSoulVisuals_v0.1.0_MO2.zip
          if-no-files-found: error
